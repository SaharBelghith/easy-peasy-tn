<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easy Peasy TN – Words of Success &amp; Growth</title>
<style>
:root{--o:#FF8A00;--d:#7A2200;--g:#14A85A;--b:#2B6FFF;--r:#E5484D;--bg:#EEF6FF}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:#1c2540;line-height:1.5}
header{background:linear-gradient(120deg,var(--o),#FFB23E);padding:8px 12px;position:sticky;top:0;z-index:5;box-shadow:0 3px 10px #0003}
.in1{max-width:960px;margin:auto}.br{display:flex;align-items:center;gap:10px}.br img{width:52px;height:52px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-5deg)}}
.br b{font-size:1.25rem;color:var(--d)}.br i{display:block;font-size:.85rem;color:#fff}
.st{display:flex;flex-wrap:wrap;gap:2px 12px;font-weight:700;font-size:.85rem;color:#fff;margin-top:6px}
.bar{height:9px;background:#fff6;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#fff;transition:width .5s}
.tabs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.tabs button{flex:1;min-width:80px;border:0;border-radius:10px;padding:8px;font:inherit;font-weight:700;background:#fff8;color:var(--d);cursor:pointer}.tabs button:hover{background:#fff}
main{max-width:960px;margin:auto;padding:12px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 14px #2b6fff1f}
h2{color:var(--d);margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:12px}
.w{border-radius:16px;padding:14px;border:3px solid;transition:.2s}.w:hover{transform:translateY(-3px) rotate(-.5deg)}
.pos{display:inline-block;border-radius:20px;padding:1px 10px;color:#fff;font-size:.8rem;font-weight:700}
.n{background:var(--b)}.v{background:var(--g)}.aj{background:#8B5CF6}.av{background:#EC4899}
.btn{min-height:46px;padding:10px 18px;border:0;border-radius:14px;font:inherit;font-weight:700;background:var(--o);color:#fff;cursor:pointer;transition:.15s;margin:4px 4px 4px 0}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 12px #0003}.btn.s{background:var(--b)}.btn.g{background:var(--g)}.btn.x{background:#7d88a3}
.opt{display:block;width:100%;text-align:left;background:#fff;color:#1c2540;border:2px solid #cfd9ee;margin:8px 0}
.ok{background:#dff7e8!important;border-color:var(--g)!important;color:#0a5a2e}.no{background:#ffe4e4!important;border-color:var(--r)!important;color:#8a1c20}
.sel{background:#fff1d6!important;border-color:var(--o)!important}
.fb{margin-top:12px;padding:12px;border-radius:14px;font-weight:600;animation:pop .35s;border:2px solid}.fb:empty{display:none}
@keyframes pop{from{transform:scale(.9);opacity:0}}
input,select{font:inherit;padding:8px 10px;border:2px solid #cfd9ee;border-radius:10px;margin:3px;max-width:100%;min-height:42px}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between;margin:10px 0}
.pill{display:inline-block;border:2px dashed #b9c6e4;border-radius:12px;padding:8px 14px;margin:4px;background:#fff;font-weight:700;cursor:grab;user-select:none}
.bk{min-height:80px;border:3px dashed;border-radius:14px;padding:8px}
.fc{height:330px;perspective:900px;cursor:pointer;margin:10px 0}.fc .in{position:relative;height:100%;transition:transform .55s;transform-style:preserve-3d}.fc.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.f1{background:linear-gradient(135deg,#FFB23E,var(--o));color:#fff}.f1 h1{margin:0;font-size:clamp(1.5rem,7vw,2.6rem)}.f2{background:#e6f0ff;transform:rotateY(180deg);align-items:flex-start;text-align:left}
#ts{position:fixed;left:50%;bottom:20px;transform:translate(-50%,90px);background:var(--d);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;transition:.4s;z-index:9;text-align:center}#ts.show{transform:translate(-50%,0)}
.big{font-size:2rem;font-weight:800;color:var(--d)}.scr{font-size:1.8rem;letter-spacing:6px;color:var(--b)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),pk=a=>a[Math.floor(Math.random()*a.length)],V=$('#v');
const W=[["Opportunity","noun","A set of circumstances that makes it possible to do something.","This scholarship is a great opportunity to study abroad.","🌟"],
["Consequences","noun","A result or effect of an action or condition.","Skipping class has serious consequences for your grades.","⚖️"],
["Accomplish","verb","To finish something successfully or achieve a goal.","She worked hard to accomplish her mission.","🎯"],
["Pediatrician","noun","A medical doctor who specializes in the care of children.","The pediatrician gave the baby a vaccine.","🩺"],
["Hesitation","noun","The action of pausing before saying or doing something.","He agreed to join the team without hesitation.","⏸️"],
["Provide","verb","To make available for use; to supply.","The company will provide all the necessary training.","🎁"],
["Self-confident","adjective","Feeling or showing confidence in oneself.","She is very self-confident when she speaks in public.","😎"],
["Confidence","noun","The feeling or belief that one can rely on someone or something.","I have complete confidence in your abilities.","💪"],
["Expand","verb","To become larger or more extensive.","The business plans to expand into new markets.","📈"],
["Secure","verb / adjective","Verb: to obtain or fix firmly. Adjective: safe and protected.","He managed to secure a job. / The building is very secure.","🔒"]];
const CL=["#FF8A00","#2B6FFF","#14A85A","#E5484D","#8B5CF6","#0EA5A5","#EC4899","#D97706","#4F46E5","#059669"];
const FAM=[["💪 Confidence family",[["confidence","noun","n","She has confidence."],["confident / self-confident","adjective","aj","She is confident."],["confidently","adverb","av","She spoke confidently."]]],
["⏸️ Hesitation family",[["hesitate","verb","v","Don't hesitate to ask."],["hesitation","noun","n","He showed no hesitation."],["hesitant","adjective","aj","She was hesitant to agree."],["hesitantly","adverb","av","He hesitantly raised his hand."]]],
["🔒 Secure family",[["security","noun","n","National security is important."],["secure","verb","v","Secure the door."],["secure","adjective","aj","A secure job."],["securely","adverb","av","Tie it securely."]]]];
const PR=[["Pediatrician","/ˌpiːdiəˈtrɪʃən/","pe·di·a·<b>TRI</b>·cian","Stress: 4th sound group, “TRI”."],["Hesitation","/ˌhezɪˈteɪʃn/","hes·i·<b>TA</b>·tion","Stress: “TA” (rhymes with “day”)."],["Consequences","/ˈkɒnsɪkwənsɪz/","<b>CON</b>·se·quen·ces","Stress: the first syllable, “CON”."]];
const PRAISE=["🌟 Excellent!","🎉 Great job!","🔥 You're on fire!","🧠 Your brain is learning!","😎 You've got this!","🏆 Vocabulary master!","✨ One more step!"],KEEP=["💪 Keep going — mistakes are part of learning! 🌱","🌱 Mistakes help you improve!","🚀 Almost there — you'll get the next one!"];
let S;function init(){S={sc:0,ok:0,bad:0,st:0,best:0,done:{},cur:0,kn:{},bd:{},pr:0,s0:0}}init();
function say(t,r){if(!('speechSynthesis' in window))return toast("🔇 Speech is not supported in this browser");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||.85;speechSynthesis.speak(u)}
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
const MAX=()=>E.reduce((a,x)=>a+x.n,0),nd=()=>Object.keys(S.done).length;
function upd(){const m=MAX(),p=Math.round(100*S.sc/m);$('#s1').textContent=`⭐ Score: ${S.sc}/${m} (${p}%)`;$('#s2').textContent=`🎯 Progress: ${Math.round(100*nd()/15)}%`;$('#s3').textContent=`✅ Correct: ${S.ok}`;$('#s4').textContent=`❌ Incorrect: ${S.bad}`;$('#s5').textContent=`🔥 Streak: ${S.st}`;
$('#s6').textContent='📍 '+(S.cur==0?'Course':S.cur<=15?`Exercise ${S.cur}/15`:S.cur==16?'Results':'Flashcards');$('#pb').style.width=Math.round(100*nd()/15)+'%'}
function sc(g){if(S.pr)return;if(g){S.sc++;S.ok++;S.st++;S.best=Math.max(S.best,S.st)}else{S.bad++;S.st=0}upd()}
function fb(g,c,y){const e=$('#fb'),s=S.st;e.className='fb '+(g?'ok':'no');e.innerHTML=(g?'✅ Correct! '+pk(PRAISE):'❌ Not quite! '+pk(KEEP))+`<br>Correct answer: <b>${c}</b>`+(y?'<br>'+y:'')+(g&&!S.pr&&(s==3||s==5||s==10)?`<br>${s==3?'🔥':s==5?'🔥🔥':'🏆'} <b>${s} correct in a row!</b>`:'')}
const BD=[["🌱","First Step",()=>nd()>=1],["🔥","On Fire",()=>S.best>=5],["🧠","Word Explorer",()=>nd()>=10],["🏆","Vocabulary Master",()=>S.done[15]],["💎","Perfect Score",()=>nd()==15&&S.sc==MAX()]];
function bdg(){BD.forEach(b=>{if(!S.bd[b[1]]&&b[2]()){S.bd[b[1]]=1;toast(`🏅 Badge unlocked: ${b[0]} ${b[1]}`)}})}
